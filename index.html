<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urnik posegov — EP laboratorij</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #0d1b2a; color: #eaf2fb; margin: 0; padding: 0; }
  #lock { position: fixed; top:0; left:0; right:0; bottom:0; background:#0d1b2a; text-align:center; padding-top:18%; }
  #lock input { background:#16263a; color:#eaf2fb; border:1px solid #2c445f; border-radius:8px; padding:12px 16px; font-size:18px; width:260px; text-align:center; }
  #lock button { background:#37b7c3; color:#062028; border:none; border-radius:8px; padding:12px 28px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:14px; }
  #lock .err { color:#ff9b9b; font-size:14px; margin-top:10px; height:18px; }
  #app { display:none; }
  .board { padding: 24px 32px 40px; }
  .board-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; border-bottom:2px solid #37b7c3; padding-bottom:12px; }
  .board-head h1 { font-size:34px; font-weight:bold; margin:0; }
  .board-head .now { font-size:20px; color:#9fb6cf; }
  .board-head #weather { margin-right:18px; color:#37b7c3; }
  .board-head #traffic { margin-right:18px; color:#9fb6cf; }
  .board-head #traffic .tstat { font-weight:bold; }
  .board-head #wicon { display:inline-block; vertical-align:middle; margin-right:8px; }
  .board-head #wicon svg { vertical-align:middle; }
  .board-head #wtemp { vertical-align:middle; }
  .days { display:block; }
  .day { background:#16263a; border:1px solid #2c445f; border-radius:12px; overflow:hidden; }
  .day.is-today { border-color:#37b7c3; border-width:2px; }
  .day-head { height:72px; box-sizing:border-box; padding:0 18px; background:#1b2f47; border-bottom:1px solid #2c445f; display:flex; align-items:center; justify-content:space-between; flex-wrap:nowrap; overflow:hidden; }
  .day-head-left { display:flex; flex-direction:column; justify-content:center; }
  .day-head .dow-row { display:flex; align-items:center; }
  .day-head .dow { font-size:24px; font-weight:bold; white-space:nowrap; line-height:1.1; }
  .day-head .date { font-size:15px; color:#9fb6cf; white-space:nowrap; line-height:1.2; margin-top:2px; }
  .day-head .badge-today { margin-left:10px; font-size:12px; font-weight:bold; color:#062028; background:#37b7c3; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .day-head .staff-inline { display:flex; align-items:center; flex-shrink:0; padding-left:8px; }
  .cases { list-style:none; padding:6px 0; margin:0; }
  .case { padding:12px 18px; border-bottom:1px solid rgba(44,68,95,0.5); }
  .case .num { font-size:20px; font-weight:bold; color:#37b7c3; margin-right:12px; }
  .case .name { font-size:23px; font-weight:bold; }
  .case .desc { font-size:18px; color:#9fb6cf; margin-top:2px; }
  .case.study { background:rgba(242,177,52,0.08); }
  .case.study .tag { display:inline-block; font-size:11px; font-weight:bold; color:#2a1e00; background:#f2b134; padding:2px 8px; border-radius:4px; margin-left:8px; }
  .weeknav { display:flex; align-items:center; justify-content:center; padding:8px 0 14px; gap:20px; }
  .weeknav .wklabel { font-size:20px; font-weight:bold; color:#eaf2fb; min-width:340px; text-align:center; }
  .weeknav .wkarrow { font-size:26px; color:#37b7c3; cursor:pointer; user-select:none; padding:2px 14px; border-radius:8px; background:rgba(55,183,195,0.12); }
  .weeknav .wkarrow.dim { color:#3a5170; background:transparent; }
  .weekdays { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; align-items:start; }
  .weekpreview { margin-top:18px; opacity:0.4; }
  .weekpreview .preview-label { font-size:15px; color:#9fb6cf; margin:0 0 8px 4px; font-weight:bold; }
  .staff { display:inline-flex; align-items:center; }
  .staff .chip { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; color:#fff; font-size:12px; font-weight:bold; margin-left:5px; box-sizing:border-box; }
  .staff .chipsep { display:inline-block; width:1px; height:20px; background:#2c445f; margin:0 4px 0 9px; vertical-align:middle; }
  .case .case-main { display:flex; align-items:center; }
  .case .sysname { margin-left:auto; font-size:13px; font-weight:bold; color:#fff; padding:3px 10px; border-radius:6px; white-space:nowrap; }
  .state { padding:60px 20px; text-align:center; color:#9fb6cf; font-size:20px; }
  .updated { text-align:right; color:#9fb6cf; font-size:13px; margin-top:20px; }
  .board { padding-bottom: 70px; }
  #ticker { position:fixed; left:0; right:0; bottom:0; height:48px; line-height:48px; background:#16263a; color:#9fb6cf; font-size:20px; font-weight:normal; overflow:hidden; display:flex; border-top:1px solid #2c445f; }
  #tickerLabel { flex:0 0 auto; padding:0 16px; background:#1b2f47; color:#eaf2fb; font-weight:bold; white-space:nowrap; }
  #ticker marquee { flex:1 1 auto; height:48px; }
</style>
</head>
<body>

<div id="lock">
  <h2>Urnik posegov — EP laboratorij</h2>
  <p style="color:#9fb6cf;">Vnesi geslo za prikaz urnika.</p>
  <div><input id="pw" type="password" placeholder="Geslo"></div>
  <button onclick="tryUnlock()">Odkleni</button>
  <div class="err" id="lockErr"></div>
</div>

<div id="app">
  <div class="board">
    <div class="board-head">
      <h1>Urnik posegov — EP laboratorij</h1>
      <div class="now"><span id="traffic"></span><span id="weather"><span id="wicon"></span><span id="wtemp"></span></span><span id="clock"></span></div>
    </div>
    <div class="days" id="days"><div class="state">Nalagam urnik…</div></div>
    <div class="updated" id="updated"></div>
  </div>
  <div id="ticker"><span id="tickerLabel"></span><marquee id="tickerText" scrollamount="6" behavior="scroll" direction="left"></marquee></div>
</div>

<script>
// ================= CONFIG =================
// Plain-text password (old TV browsers can't hash). Keep it simple; this is a
// light gate for anonymized data, not real security.
var PASSWORD = "ep2026";
// Secret for the TV auto-unlock URL:  ...index.html?k=YOUR_SECRET
var URL_SECRET = "change-this-to-a-long-random-string";
var SCHEDULE_URL = "schedule.txt";
var REFRESH_MS = 5 * 60 * 1000;
var COOKIE_DAYS = 365;
// Ljubljana coordinates for the outside temperature:
var WEATHER_LAT = 46.05;
var WEATHER_LON = 14.51;
var WEATHER_MS = 10 * 60 * 1000; // refresh weather every 10 min
// Ticker text at the bottom. Edit this line to change the scrolling message.
// Leave as "" to auto-build it from today's cases instead.
var TICKER_TEXT = "Dobrodošli v EP laboratoriju  •  Za vprašanja pokličite interno številko  •  Lep dan!";
// System letter -> color (manufacturer palette):
// C=CARTO (orange), X=NavX/EnSite (Abbott blue), A=Affera (Medtronic navy), R=Rhythmia/Opal (Boston blue)
var SYS_COLORS = { "C":"#e0892e", "X":"#4b9cdf", "A":"#1b1060", "R":"#284d84" };
var SYS_NAMES = { "C":"CARTO", "X":"NavX", "A":"Affera", "R":"Rhythmia" };
// Global board state for week navigation
var BOARD = { weeks: [], focusIdx: 0 };
// =========================================

// Parse "AN#e0892e, MK#4b9cdf | TŽ#1b1060 | Nok#284d84" into groups of {initials,color}
function parseStaff(s){
  var groups = s.split("|");
  var out = [];
  for (var g=0; g<groups.length; g++){
    var people = groups[g].split(",");
    var arr = [];
    for (var p=0; p<people.length; p++){
      var item = people[p].replace(/^\s+|\s+$/g,"");
      if (!item) continue;
      var h = item.indexOf("#");
      var initials = h>-1 ? item.substring(0,h).replace(/^\s+|\s+$/g,"") : item;
      // Strip any stray punctuation (e.g. a "(" left in from the writer format)
      initials = initials.replace(/[()#]/g,"").replace(/^\s+|\s+$/g,"");
      var color = h>-1 ? "#"+item.substring(h+1).replace(/[^0-9a-fA-F]/g,"") : "#666";
      if (initials) arr.push({ initials:initials, color:color });
    }
    if (arr.length) out.push(arr);
  }
  return out;
}

// Decide readable text color for a chip background (dark text on light fills)
function chipTextColor(hex){
  var m = /^#?([0-9a-fA-F]{6})$/.exec((hex||"").replace(/^#/, "#"));
  if (!m){ return "#fff"; }
  var h = m[1];
  var r = parseInt(h.substring(0,2),16);
  var g = parseInt(h.substring(2,4),16);
  var b = parseInt(h.substring(4,6),16);
  // Perceived luminance; light backgrounds -> dark text
  var lum = (0.299*r + 0.587*g + 0.114*b);
  return lum > 186 ? "#12161b" : "#fff";
}

// Convert "#rrggbb" to "rgba(r,g,b,a)" for semi-transparent fills
function hexToRgba(hex, alpha){
  var h = (hex||"").replace("#","");
  if (h.length !== 6) return hex;
  var r = parseInt(h.substring(0,2),16);
  var g = parseInt(h.substring(2,4),16);
  var b = parseInt(h.substring(4,6),16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

// Render staff as rows of colored circles
function renderStaff(groups){
  if (!groups || !groups.length) return "";
  var html = '<div class="staff">';
  for (var g=0; g<groups.length; g++){
    for (var p=0; p<groups[g].length; p++){
      var person = groups[g][p];
      var txt = chipTextColor(person.color);
      var extra = (txt === "#12161b") ? ";border:1px solid #c3c8d0" : "";
      html += '<span class="chip" style="background:' + hexToRgba(person.color, 0.7) + ';color:' + txt + extra + '">' + esc(person.initials) + '</span>';
    }
    if (g < groups.length-1) html += '<span class="chipsep"></span>';
  }
  html += '</div>';
  return html;
}

var DOW = ["Nedelja","Ponedeljek","Torek","Sreda","Četrtek","Petek","Sobota"];
var MON = ["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"];

function setCookie(v){
  var d = new Date();
  d.setTime(d.getTime() + COOKIE_DAYS*24*60*60*1000);
  document.cookie = "epk=" + v + ";expires=" + d.toUTCString() + ";path=/";
}
function getCookie(){
  var parts = document.cookie.split("; ");
  for (var i=0;i<parts.length;i++){ if (parts[i].indexOf("epk=")===0) return parts[i].substring(4); }
  return "";
}
function unlock(){
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  start();
}
function tryUnlock(){
  var val = document.getElementById("pw").value;
  if (val === PASSWORD){ setCookie("ok"); unlock(); }
  else document.getElementById("lockErr").innerHTML = "Napačno geslo.";
}

// gate on load
(function(){
  var q = window.location.search;
  if (q.indexOf("k=" + URL_SECRET) > -1){ setCookie("ok"); unlock(); return; }
  if (getCookie() === "ok"){ unlock(); return; }
})();

function pad(x){ return (x<10?"0":"") + x; }

function parseDate(line){
  var m = line.match(/(\d{1,2})\s*\.\s*(\d{1,2})\s*\.\s*(\d{4})/);
  if (!m) return null;
  return new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function render(text){
  // Pull out an optional traffic line (starts with "Promet") for the header.
  // Example line in schedule.txt:  Promet A1 LJ-KP: pretočno
  var trafficText = "";
  var lines0 = text.split(/\r?\n/);
  var kept = [];
  for (var t0=0;t0<lines0.length;t0++){
    if (/^\s*promet\b/i.test(lines0[t0])){
      trafficText = lines0[t0].replace(/^\s*promet\s*/i,"").replace(/^\s+|\s+$/g,"");
    } else {
      kept.push(lines0[t0]);
    }
  }
  text = kept.join("\n");
  updateTraffic(trafficText);

  // Split off the "Zadnje naročilo" section for the ticker.
  // Everything from that line onward goes to the bottom scroll bar;
  // everything before it is the schedule board.
  var tickerLabel = "";
  var tickerBody = "";
  var splitRe = /zadnje\s+naročilo\s*:?/i;
  var mSplit = text.match(splitRe);
  if (mSplit){
    var cut = text.search(splitRe);
    var after = text.substring(cut);           // "Zadnje naročilo: ...."
    text = text.substring(0, cut);             // schedule portion only
    // Separate the label from the rolling body
    var colon = after.indexOf(":");
    if (colon > -1){
      tickerLabel = after.substring(0, colon+1).replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");
      tickerBody = after.substring(colon+1).replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");
    } else {
      tickerBody = after.replace(/\s+/g," ").replace(/^\s+|\s+$/g,"");
    }
  }
  updateTicker(tickerLabel, tickerBody);

  var lines = text.split(/\r?\n/);
  var days = [];
  var cur = null;
  for (var i=0;i<lines.length;i++){
    var line = lines[i].replace(/^\s+|\s+$/g,"");
    if (!line) continue;
    var d = parseDate(line);
    if (d){ cur = { date:d, cases:[], staff:null }; days.push(cur); }
    else if (cur){
      // Staff line: "@osebje: AN#e0892e, MK#4b9cdf | TŽ#1b1060 | Nok#284d84"
      if (/^@osebje\s*:/i.test(line)){
        cur.staff = parseStaff(line.replace(/^@osebje\s*:/i,""));
        continue;
      }
      var idx = line.indexOf(";");
      var name = line, desc = "";
      if (idx > -1){ name = line.substring(0,idx).replace(/^\s+|\s+$/g,""); desc = line.substring(idx+1).replace(/^\s+|\s+$/g,""); }
      // System tag: "Iztok M. [C]" -> system letter C, name without the tag
      var sys = "";
      var tagM = name.match(/\[([CXAR])\]\s*$/i);
      if (tagM){ sys = tagM[1].toUpperCase(); name = name.replace(/\[([CXAR])\]\s*$/i,"").replace(/^\s+|\s+$/g,""); }
      var study = /študija/i.test(line);
      cur.cases.push({ name:name, desc:desc, study:study, sys:sys });
    }
  }
  var host = document.getElementById("days");
  var today = new Date();

  // ---- Group all parsed days into Mon–Fri weeks ----
  // Anchor each day to its Monday; collect distinct weeks in chronological order.
  function mondayOf(d){
    var dw = d.getDay();
    var delta = (dw === 0) ? -6 : (1 - dw);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + delta);
  }

  // Determine the span of weeks to show: from the earliest file date's week
  // through the latest file date's week. If the file is empty, show this week.
  var minD = null, maxD = null;
  for (var a=0;a<days.length;a++){
    if (!minD || days[a].date < minD) minD = days[a].date;
    if (!maxD || days[a].date > maxD) maxD = days[a].date;
  }
  if (!minD){ minD = today; maxD = today; }

  var firstMon = mondayOf(minD);
  var lastMon = mondayOf(maxD);

  // Build the list of weeks (each = array of 5 Mon–Fri slots with matched data)
  var weeks = [];
  var wkMon = new Date(firstMon.getFullYear(), firstMon.getMonth(), firstMon.getDate());
  while (wkMon <= lastMon){
    var wk = [];
    for (var s=0;s<5;s++){
      var slotDate = new Date(wkMon.getFullYear(), wkMon.getMonth(), wkMon.getDate() + s);
      var matched = null;
      for (var m2=0;m2<days.length;m2++){
        if (sameDay(days[m2].date, slotDate)){ matched = days[m2]; break; }
      }
      wk.push({ date: slotDate, cases: matched ? matched.cases : [], staff: matched ? matched.staff : null });
    }
    weeks.push({ monday: new Date(wkMon.getFullYear(), wkMon.getMonth(), wkMon.getDate()), days: wk });
    wkMon = new Date(wkMon.getFullYear(), wkMon.getMonth(), wkMon.getDate() + 7);
  }

  // ---- Pick the focused week: the one containing today, else the first ----
  var todayMon = mondayOf(today);
  var focusIdx = 0;
  for (var w=0; w<weeks.length; w++){
    if (sameDay(weeks[w].monday, todayMon)){ focusIdx = w; break; }
  }
  // If today is before all weeks, focus the first; if after all, focus the last.
  if (today > maxD) focusIdx = weeks.length - 1;

  // Store globally so the arrow keys can change focus and re-render.
  BOARD.weeks = weeks;
  BOARD.focusIdx = focusIdx;
  renderWeeks();
}

// Render the focused week full-size plus the next week as a faded preview.
function renderWeeks(){
  var host = document.getElementById("days");
  var weeks = BOARD.weeks;
  if (!weeks || !weeks.length){ host.innerHTML = ""; return; }

  var idx = BOARD.focusIdx;
  if (idx < 0) idx = 0;
  if (idx > weeks.length-1) idx = weeks.length-1;
  BOARD.focusIdx = idx;

  var today = new Date();
  var html = "";

  // Week navigation header (arrows + week label)
  var focusWeek = weeks[idx];
  var wkStart = focusWeek.days[0].date;
  var wkEnd = focusWeek.days[4].date;
  var label = wkStart.getDate() + ". " + MON[wkStart.getMonth()] + " – " +
              wkEnd.getDate() + ". " + MON[wkEnd.getMonth()] + " " + wkEnd.getFullYear();
  var leftDim = (idx <= 0) ? " dim" : "";
  var rightDim = (idx >= weeks.length-1) ? " dim" : "";
  html += '<div class="weeknav">' +
          '<span class="wkarrow' + leftDim + '" id="wkPrev">&#9664;</span>' +
          '<span class="wklabel">' + label + '</span>' +
          '<span class="wkarrow' + rightDim + '" id="wkNext">&#9654;</span>' +
          '</div>';

  // Focused week — full opacity
  html += '<div class="weekblock">' + renderWeekDays(focusWeek.days, today, false) + '</div>';

  // Next week preview — faded (only if one exists)
  if (idx < weeks.length-1){
    var nextWeek = weeks[idx+1];
    var ns = nextWeek.days[0].date, ne = nextWeek.days[4].date;
    var nlabel = "Naslednji teden: " + ns.getDate() + ". " + MON[ns.getMonth()] + " – " +
                 ne.getDate() + ". " + MON[ne.getMonth()] + " " + ne.getFullYear();
    html += '<div class="weekpreview">' +
            '<div class="preview-label">' + nlabel + '</div>' +
            renderWeekDays(nextWeek.days, today, true) +
            '</div>';
  }

  host.innerHTML = html;

  // Wire arrow clicks (keyboard handled separately)
  var prev = document.getElementById("wkPrev");
  var next = document.getElementById("wkNext");
  if (prev) prev.onclick = function(){ shiftWeek(-1); };
  if (next) next.onclick = function(){ shiftWeek(1); };
}

function shiftWeek(delta){
  if (!BOARD.weeks) return;
  var n = BOARD.focusIdx + delta;
  if (n < 0) n = 0;
  if (n > BOARD.weeks.length-1) n = BOARD.weeks.length-1;
  BOARD.focusIdx = n;
  renderWeeks();
}

// Render the 5 day columns for one week. `faded` = preview styling.
function renderWeekDays(week, today, faded){
  var html = '<div class="weekdays' + (faded ? " faded" : "") + '">';
  for (var j=0;j<week.length;j++){
    var day = week[j];
    var isToday = !faded && sameDay(day.date, today);
    var dateStr = day.date.getDate() + ". " + MON[day.date.getMonth()] + " " + day.date.getFullYear();
    var cs = "";
    if (day.cases.length === 0){
      cs = '<li class="case"><div class="desc">Ni predvidenih posegov</div></li>';
    } else {
      for (var k=0;k<day.cases.length;k++){
        var c = day.cases[k];
        var sysColor = SYS_COLORS[c.sys] || "";
        var sysName = SYS_NAMES[c.sys] || "";
        var rowStyle = sysColor ? (' style="border-left:6px solid ' + sysColor + ';"') : "";
        var sysLabel = sysName ? ('<span class="sysname" style="background:' + hexToRgba(sysColor, 0.7) + '">' + sysName + '</span>') : "";
        cs += '<li class="case' + (c.study?" study":"") + '"' + rowStyle + '>' +
              '<div class="case-main">' +
                '<span class="num">' + (k+1) + '</span>' +
                '<span class="name">' + esc(c.name) + (c.study?'<span class="tag">ŠTUDIJA</span>':'') + '</span>' +
                sysLabel +
              '</div>' +
              (c.desc?('<div class="desc">' + esc(c.desc) + '</div>'):'') +
              '</li>';
      }
    }
    var staffHtml = day.staff ? ('<span class="staff-inline">' + renderStaff(day.staff) + '</span>') : "";
    html += '<div class="day' + (isToday?" is-today":"") + '">' +
            '<div class="day-head">' +
              '<div class="day-head-left">' +
                '<div class="dow-row"><span class="dow">' + DOW[day.date.getDay()] + '</span>' +
                (isToday?'<span class="badge-today">Danes</span>':'') + '</div>' +
                '<span class="date">' + dateStr + '</span>' +
              '</div>' +
              staffHtml +
            '</div>' +
            '<ul class="cases">' + cs + '</ul></div>';
  }
  html += '</div>';
  return html;
}

function load(){
  var xhr = new XMLHttpRequest();
  var url = SCHEDULE_URL + "?t=" + (new Date()).getTime();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function(){
    if (xhr.readyState === 4){
      if (xhr.status === 200 || xhr.status === 0){
        render(xhr.responseText);
        var n = new Date();
        document.getElementById("updated").innerHTML = "Osveženo ob " + pad(n.getHours()) + ":" + pad(n.getMinutes());
      } else {
        document.getElementById("days").innerHTML = '<div class="state">Napaka pri nalaganju (' + xhr.status + ').</div>';
      }
    }
  };
  xhr.send();
}

function tick(){
  var n = new Date();
  document.getElementById("clock").innerHTML =
    DOW[n.getDay()] + ", " + n.getDate() + "." + (n.getMonth()+1) + "." + n.getFullYear() + "  " + pad(n.getHours()) + ":" + pad(n.getMinutes());
}

// Returns an inline SVG string for a weather category based on WMO code.
function weatherIcon(code){
  var y = "#f2b134", w = "#eaf2fb", b = "#9fb6cf", c = "#37b7c3";
  var sun = '<circle cx="11" cy="11" r="6" fill="' + y + '"/>' +
    '<g stroke="' + y + '" stroke-width="2"><line x1="11" y1="1" x2="11" y2="3"/>' +
    '<line x1="11" y1="19" x2="11" y2="21"/><line x1="1" y1="11" x2="3" y2="11"/>' +
    '<line x1="19" y1="11" x2="21" y2="11"/><line x1="4" y1="4" x2="5.5" y2="5.5"/>' +
    '<line x1="16.5" y1="16.5" x2="18" y2="18"/><line x1="4" y1="18" x2="5.5" y2="16.5"/>' +
    '<line x1="16.5" y1="5.5" x2="18" y2="4"/></g>';
  var cloud = '<path d="M6 20 a5 5 0 0 1 0-10 a6 6 0 0 1 11 2 a4 4 0 0 1 -1 8 z" fill="' + w + '"/>';
  var cloudGrey = '<path d="M6 20 a5 5 0 0 1 0-10 a6 6 0 0 1 11 2 a4 4 0 0 1 -1 8 z" fill="' + b + '"/>';
  function wrap(inner){ return '<svg width="30" height="26" viewBox="0 0 24 24">' + inner + '</svg>'; }

  if (code === 0 || code === 1) return wrap(sun);
  if (code === 2) return wrap('<circle cx="8" cy="9" r="4.5" fill="' + y + '"/>' + cloud);
  if (code === 3) return wrap(cloudGrey);
  if (code === 45 || code === 48) return wrap(cloudGrey +
    '<g stroke="' + b + '" stroke-width="1.5"><line x1="4" y1="21" x2="20" y2="21"/>' +
    '<line x1="6" y1="23" x2="18" y2="23"/></g>');
  if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return wrap(cloud +
    '<g stroke="' + c + '" stroke-width="2"><line x1="8" y1="20" x2="6" y2="24"/>' +
    '<line x1="13" y1="20" x2="11" y2="24"/><line x1="18" y1="20" x2="16" y2="24"/></g>');
  if (code >= 71 && code <= 86) return wrap(cloud +
    '<g fill="' + w + '"><circle cx="7" cy="22" r="1.5"/><circle cx="12" cy="23" r="1.5"/>' +
    '<circle cx="17" cy="22" r="1.5"/></g>');
  if (code >= 95) return wrap(cloudGrey +
    '<polygon points="12,19 8,25 11,25 9,29 16,22 12,22" fill="' + y + '"/>');
  return wrap(cloudGrey);
}

function loadWeather(){
  var xhr = new XMLHttpRequest();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER_LAT +
            "&longitude=" + WEATHER_LON + "&current_weather=true";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function(){
    if (xhr.readyState === 4 && xhr.status === 200){
      try {
        var data = eval("(" + xhr.responseText + ")"); // old-browser-safe JSON parse
        var t = data.current_weather.temperature;
        var code = data.current_weather.weathercode;
        document.getElementById("wicon").innerHTML = weatherIcon(code);
        document.getElementById("wtemp").innerHTML = Math.round(t) + "°C";
      } catch(e){}
    }
  };
  xhr.send();
}

function updateTraffic(text){
  var el = document.getElementById("traffic");
  if (!el) return;
  if (text){
    // Color the status: green-ish if "pretočno", amber if a jam word appears.
    var cls = "tstat";
    var color = "#3ec97a"; // flowing = green
    if (/zastoj|zapora|nesreč|kolona|oviran/i.test(text)) color = "#f2b134"; // amber
    el.innerHTML = 'Promet: <span class="' + cls + '" style="color:' + color + '">' + esc(text) + '</span>';
    el.style.display = "inline";
  } else {
    el.style.display = "none";
  }
}

function updateTicker(label, body){
  var lblEl = document.getElementById("tickerLabel");
  var txtEl = document.getElementById("tickerText");
  if (!lblEl || !txtEl) return;
  if (body){
    lblEl.innerHTML = label ? esc(label) : "";
    lblEl.style.display = label ? "block" : "none";
    txtEl.innerHTML = esc(body);
  } else {
    // No "Zadnje naročilo" section in the file -> show the fallback message
    lblEl.style.display = "none";
    txtEl.innerHTML = esc(TICKER_TEXT);
  }
}

function start(){
  tick();
  setInterval(tick, 1000);
  load();
  setInterval(load, REFRESH_MS);
  loadWeather();
  setInterval(loadWeather, WEATHER_MS);

  // Left/Right arrow keys (remote/keyboard) change the focused week
  document.onkeydown = function(e){
    var code = e.keyCode || e.which;
    if (code === 37){ shiftWeek(-1); }      // left
    else if (code === 39){ shiftWeek(1); }   // right
  };
}
</script>
