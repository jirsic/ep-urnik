<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urnik posegov — EP laboratorij</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #0d1b2a; color: #eaf2fb; margin: 0; padding: 0; }
  #lock { position: fixed; top:0; left:0; right:0; bottom:0; background:#0d1b2a; text-align:center; padding-top:18%; }
  #lock input { background:#16263a; color:#eaf2fb; border:1px solid #2c445f; border-radius:8px; padding:12px 16px; font-size:18px; width:260px; text-align:center; }
  #lock button { background:#37b7c3; color:#062028; border:none; border-radius:8px; padding:12px 28px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:14px; }
  #lock .err { color:#ff9b9b; font-size:14px; margin-top:10px; height:18px; }
  #app { display:none; }
  .board { padding: 24px 32px 40px; }
  .board-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; border-bottom:2px solid #37b7c3; padding-bottom:12px; }
  .board-head h1 { font-size:34px; font-weight:bold; margin:0; }
  .board-head .now { font-size:20px; color:#9fb6cf; }
  .days { display:block; }
  .day { display:inline-block; vertical-align:top; width:31%; min-width:300px; margin:0 1% 22px 0; background:#16263a; border:1px solid #2c445f; border-radius:12px; overflow:hidden; }
  .day.is-today { border-color:#37b7c3; }
  .day-head { padding:14px 18px; background:#1b2f47; border-bottom:1px solid #2c445f; }
  .day-head .dow { font-size:24px; font-weight:bold; }
  .day-head .date { font-size:16px; color:#9fb6cf; margin-left:10px; }
  .day-head .badge-today { float:right; font-size:12px; font-weight:bold; color:#062028; background:#37b7c3; padding:3px 10px; border-radius:20px; }
  .cases { list-style:none; padding:6px 0; margin:0; }
  .case { padding:12px 18px; border-bottom:1px solid rgba(44,68,95,0.5); }
  .case .num { font-size:20px; font-weight:bold; color:#37b7c3; margin-right:12px; }
  .case .name { font-size:23px; font-weight:bold; }
  .case .desc { font-size:18px; color:#9fb6cf; margin-top:2px; }
  .case.study { background:rgba(242,177,52,0.08); }
  .case.study .tag { display:inline-block; font-size:11px; font-weight:bold; color:#2a1e00; background:#f2b134; padding:2px 8px; border-radius:4px; margin-left:8px; }
  .state { padding:60px 20px; text-align:center; color:#9fb6cf; font-size:20px; }
  .updated { text-align:right; color:#9fb6cf; font-size:13px; margin-top:20px; }
</style>
</head>
<body>

<div id="lock">
  <h2>Urnik posegov — EP laboratorij</h2>
  <p style="color:#9fb6cf;">Vnesi geslo za prikaz urnika.</p>
  <div><input id="pw" type="password" placeholder="Geslo"></div>
  <button onclick="tryUnlock()">Odkleni</button>
  <div class="err" id="lockErr"></div>
</div>

<div id="app">
  <div class="board">
    <div class="board-head">
      <h1>Urnik posegov — EP laboratorij</h1>
      <div class="now" id="clock"></div>
    </div>
    <div class="days" id="days"><div class="state">Nalagam urnik…</div></div>
    <div class="updated" id="updated"></div>
  </div>
</div>

<script>
// ================= CONFIG =================
// Plain-text password (old TV browsers can't hash). Keep it simple; this is a
// light gate for anonymized data, not real security.
var PASSWORD = "ep2026";
// Secret for the TV auto-unlock URL:  ...index.html?k=YOUR_SECRET
var URL_SECRET = "change-this-to-a-long-random-string";
var SCHEDULE_URL = "schedule.txt";
var REFRESH_MS = 5 * 60 * 1000;
var COOKIE_DAYS = 365;
// =========================================

var DOW = ["Nedelja","Ponedeljek","Torek","Sreda","Četrtek","Petek","Sobota"];
var MON = ["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"];

function setCookie(v){
  var d = new Date();
  d.setTime(d.getTime() + COOKIE_DAYS*24*60*60*1000);
  document.cookie = "epk=" + v + ";expires=" + d.toUTCString() + ";path=/";
}
function getCookie(){
  var parts = document.cookie.split("; ");
  for (var i=0;i<parts.length;i++){ if (parts[i].indexOf("epk=")===0) return parts[i].substring(4); }
  return "";
}
function unlock(){
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  start();
}
function tryUnlock(){
  var val = document.getElementById("pw").value;
  if (val === PASSWORD){ setCookie("ok"); unlock(); }
  else document.getElementById("lockErr").innerHTML = "Napačno geslo.";
}

// gate on load
(function(){
  var q = window.location.search;
  if (q.indexOf("k=" + URL_SECRET) > -1){ setCookie("ok"); unlock(); return; }
  if (getCookie() === "ok"){ unlock(); return; }
})();

function pad(x){ return (x<10?"0":"") + x; }

function parseDate(line){
  var m = line.match(/(\d{1,2})\s*\.\s*(\d{1,2})\s*\.\s*(\d{4})/);
  if (!m) return null;
  return new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10));
}
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function render(text){
  var lines = text.split(/\r?\n/);
  var days = [];
  var cur = null;
  for (var i=0;i<lines.length;i++){
    var line = lines[i].replace(/^\s+|\s+$/g,"");
    if (!line) continue;
    var d = parseDate(line);
    if (d){ cur = { date:d, cases:[] }; days.push(cur); }
    else if (cur){
      var idx = line.indexOf(";");
      var name = line, desc = "";
      if (idx > -1){ name = line.substring(0,idx).replace(/^\s+|\s+$/g,""); desc = line.substring(idx+1).replace(/^\s+|\s+$/g,""); }
      var study = /študija/i.test(line);
      cur.cases.push({ name:name, desc:desc, study:study });
    }
  }
  var host = document.getElementById("days");
  if (!days.length){ host.innerHTML = '<div class="state">Ni prepoznanih dni v urniku.</div>'; return; }
  var today = new Date();
  var html = "";
  for (var j=0;j<days.length;j++){
    var day = days[j];
    var isToday = sameDay(day.date, today);
    var dateStr = day.date.getDate() + ". " + MON[day.date.getMonth()] + " " + day.date.getFullYear();
    var cs = "";
    if (day.cases.length === 0){
      cs = '<li class="case"><div class="desc">— ni posegov —</div></li>';
    } else {
      for (var k=0;k<day.cases.length;k++){
        var c = day.cases[k];
        cs += '<li class="case' + (c.study?" study":"") + '">' +
              '<span class="num">' + (k+1) + '</span>' +
              '<span class="name">' + esc(c.name) + (c.study?'<span class="tag">ŠTUDIJA</span>':'') + '</span>' +
              (c.desc?('<div class="desc">' + esc(c.desc) + '</div>'):'') +
              '</li>';
      }
    }
    html += '<div class="day' + (isToday?" is-today":"") + '">' +
            '<div class="day-head"><span class="dow">' + DOW[day.date.getDay()] + '</span>' +
            '<span class="date">' + dateStr + '</span>' +
            (isToday?'<span class="badge-today">Danes</span>':'') + '</div>' +
            '<ul class="cases">' + cs + '</ul></div>';
  }
  host.innerHTML = html;
}

function load(){
  var xhr = new XMLHttpRequest();
  var url = SCHEDULE_URL + "?t=" + (new Date()).getTime();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function(){
    if (xhr.readyState === 4){
      if (xhr.status === 200 || xhr.status === 0){
        render(xhr.responseText);
        var n = new Date();
        document.getElementById("updated").innerHTML = "Osveženo ob " + pad(n.getHours()) + ":" + pad(n.getMinutes());
      } else {
        document.getElementById("days").innerHTML = '<div class="state">Napaka pri nalaganju (' + xhr.status + ').</div>';
      }
    }
  };
  xhr.send();
}

function tick(){
  var n = new Date();
  document.getElementById("clock").innerHTML =
    DOW[n.getDay()] + ", " + n.getDate() + "." + (n.getMonth()+1) + "." + n.getFullYear() + "  " + pad(n.getHours()) + ":" + pad(n.getMinutes());
}

function start(){
  tick();
  setInterval(tick, 1000);
  load();
  setInterval(load, REFRESH_MS);
}
</script>
</body>
</html>
